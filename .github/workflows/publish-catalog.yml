name: Publish daily catalog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-catalog.yml"
      - ".github/catalog/build-musicbrainz-catalog.mjs"
      - ".github/catalog/split-musicbrainz-catalog.mjs"
      - ".github/catalog/download-musicbrainz-catalog.mjs"
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download latest MusicBrainz dump
        run: node .github/catalog/download-musicbrainz-catalog.mjs "${{ runner.temp }}/release-group.tar.xz"

      - name: Build and split daily catalog
        run: |
          node .github/catalog/build-musicbrainz-catalog.mjs "${{ runner.temp }}/release-group.tar.xz" "${{ runner.temp }}/catalog.json"
          node .github/catalog/split-musicbrainz-catalog.mjs "${{ runner.temp }}/catalog.json" "site/catalog"

      - name: Add catalog landing page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>On This Day catalog</title></head>
          <body><h1>On This Day catalog</h1><p>Daily album anniversary data powered by MusicBrainz.</p></body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
