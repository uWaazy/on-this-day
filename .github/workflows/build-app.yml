name: Build Spicetify app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          OTD_SPOTIFY_CLIENT_ID: ${{ vars.OTD_SPOTIFY_CLIENT_ID }}
          OTD_SPOTIFY_REDIRECT_URI: ${{ vars.OTD_SPOTIFY_REDIRECT_URI }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: on-this-day-spicetify
          path: dist/
          if-no-files-found: error
          retention-days: 30
