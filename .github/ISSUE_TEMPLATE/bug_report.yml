
name: Bug Report
description: Report a bug or unexpected behavior in On This Day.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve On This Day!

        Before submitting, please check whether this issue has already been reported.
        Use this form only to report bugs and unexpected behavior.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the problem you encountered.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1. Open Spotify
        2. Navigate to On This Day
        3. Perform the action...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: On This Day Version
      description: Specify the version or commit you are using.
      placeholder: e.g. 1.0.0 or commit hash
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs and Screenshots
      description: Attach screenshots or provide relevant error messages and logs.
      placeholder: Paste relevant logs or describe your screenshots here.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked that this issue has not already been reported.
          required: true
        - label: This report describes a bug, not a feature request.
          required: true
